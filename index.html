<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>анимированный плакат</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
    <link rel="icon" href="images/carcur.png" type="image/png" />
    <meta property="og:type" content="web-site" />
    <meta property="og:title" content="Анимированный плакат" />
    <meta
      property="og:description"
      content="Рекламный плакат приложения Aion, которое создано для перемещение в прошлое."
    />
    <meta
      property="og:image"
      content="https://github.com/stasikola/posteraionnN-Y/blob/main/images/cover.jpg?raw=true"
    />
    <meta
      property="og:url"
      content="https://stasikola.github.io/posteraionnN-Y/"
    />
  </head>

  <body>
    <div class="block-1">
      <h1>Новый год</h1>
      <p>как в детстве</p>
    </div>
    <div class="runstr-1">
      <p>
        Хотите снова почувствовать тот самый трепет? Мы знаем, как вернуться!
        Забронируйте поездку в прошлое, пока огни на ёлке ещё горят.
      </p>
    </div>
    <div class="chris-tree">
      <div class="sh-1"><img class="sh1" src="images/sh1.png" alt="" /></div>
      <div class="sh-2"><img class="sh2" src="images/sh2.png" alt="" /></div>
      <div class="sh-3"><img class="sh3" src="images/sh3.png" alt="" /></div>
      <div class="sh-4"><img class="sh4" src="images/sh6.png" alt="" /></div>
      <div class="sh-5"><img class="sh5" src="images/sh5.png" alt="" /></div>
      <div class="sh-6"><img class="sh6" src="images/sh4.png" alt="" /></div>
      <div class="sh-7"><img class="sh7" src="images/sh7.png" alt="" /></div>
      <div class="sh-8"><img class="sh8" src="images/sh8.png" alt="" /></div>
      <div class="sh-9"><img class="sh9" src="images/sh9.png" alt="" /></div>
      <div class="sh-10"><img class="sh10" src="images/sh10.png" alt="" /></div>
      <div class="b1">
        <img class="be" src="images/be.png" alt="" />
        <img class="box1" src="images/box1-r.png" alt="" />
        <img class="box1-r" src="images/box1.png" alt="" />
      </div>
      <div class="b2"><img class="box3" src="images/box3.png" alt="" /></div>
      <div class="b3"><img class="box2" src="images/box2.png" alt="" /></div>
      <div class="b4"><img class="box4" src="images/box4.png" alt="" /></div>
      <div class="b5"><img class="box5" src="images/box5.png" alt="" /></div>
      <div class="b6">
        <img class="be2" src="images/candy.png" alt="" />
        <img class="box6-r" src="images/box6-r.png" alt="" />
        <img class="box6" src="images/box6.png" alt="" />
      </div>
      <div class="ho">
        <img class="horse" src="images/ho.png" alt="" />
      </div>
    </div>
    <div class="runstr-2">
      <p>Выбери подарок! Порадуй себя и близких</p>
    </div>
    <div class="block-2">
      <div class="colum1">
        <div class="postcard">
          <img class="postcards" src="images/postcard1.png" alt="открытка" />
        </div>
        <h1>Подарок для себя</h1>
      </div>
      <div class="colum2">
        <div class="postcard">
          <img class="postcards" src="images/postcard2.png" alt="открытка" />
        </div>
        <h1>Подарок для близких</h1>
      </div>
    </div>
  </body>
</html>
